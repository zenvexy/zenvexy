<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Every commit is a new checkpoint.</title>
  <desc id="desc">An ember-lit sword rests at a small bonfire above the words: Every commit is a new checkpoint. Rest at the bonfire. Then build again.</desc>
  <defs>
    <radialGradient id="warmth">
      <stop stop-color="#d7af62" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d7af62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="1200" y2="50">
      <stop stop-color="#30291e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d7af62" stop-opacity=".5"/>
      <stop offset="1" stop-color="#30291e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .warmth { animation: breathe 5s ease-in-out infinite; }
      .ember { animation: rise 4s ease-in-out infinite; }
      .ember-late { animation-delay: -2s; }
      @keyframes breathe { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
      @keyframes rise { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: .9; transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .warmth, .ember { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="220" rx="12" fill="#0d0c0a"/>
  <rect x=".5" y=".5" width="1199" height="219" rx="11.5" fill="none" stroke="#30291e"/>
  <ellipse class="warmth" cx="600" cy="62" rx="230" ry="115" fill="url(#warmth)"/>
  <path d="M48 50H520M680 50H1152" stroke="url(#rule)"/>
  <path d="M535 50l4-4 4 4-4 4Zm122 0 4-4 4 4-4 4Z" fill="#d7af62" opacity=".45"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m584 72 30 7m-27 0 28-8" stroke="#a39882" stroke-width="2" opacity=".6"/>
    <path d="M600 74c-15-7-10-16-6-22-1 7 4 7 5 1 2-7 1-9 4-14 0 9 8 14 7 22-1 7-5 11-10 13Z" fill="#f08a4b" fill-opacity=".18" stroke="#d7af62" stroke-width="1.3"/>
    <path d="m600 69 1-39m-7 5h14m-7-13v8" stroke="#eee6d3" stroke-width="1.8"/>
    <path d="m597 22 4-3 4 3" stroke="#d7af62" stroke-width="1.5"/>
  </g>
  <g fill="#f08a4b">
    <circle class="ember" cx="586" cy="42" r="1.4" opacity=".6"/>
    <circle class="ember ember-late" cx="616" cy="32" r="1" opacity=".4"/>
    <circle class="ember ember-late" cx="580" cy="61" r=".8" opacity=".5"/>
  </g>
  <text x="600" y="131" fill="#eee6d3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="43" letter-spacing="-.7">Every commit is a new checkpoint.</text>
  <text x="600" y="165" fill="#a39882" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2.6">REST AT THE BONFIRE. THEN BUILD AGAIN.</text>
  <path d="M430 194h145m50 0h145" stroke="#30291e"/>
  <path d="m596 194 4-4 4 4-4 4Z" fill="#d7af62" opacity=".65"/>
</svg>
